<svg viewBox="0 0 1200 1400" xmlns="http://www.w3.org/2000/svg">
  <!-- Sun rays -->
  <g id="sun-rays">
    <rect x="560" y="80" width="80" height="180" fill="#c84a2a" transform="rotate(0 600 170)"/>
    <rect x="560" y="80" width="80" height="180" fill="#d85a34" transform="rotate(22.5 600 170)"/>
    <rect x="560" y="80" width="80" height="180" fill="#e86a3e" transform="rotate(45 600 170)"/>
    <rect x="560" y="80" width="80" height="180" fill="#f57c2a" transform="rotate(67.5 600 170)"/>
    <rect x="560" y="80" width="80" height="180" fill="#f57c2a" transform="rotate(90 600 170)"/>
    <rect x="560" y="80" width="80" height="180" fill="#f57c2a" transform="rotate(112.5 600 170)"/>
    <rect x="560" y="80" width="80" height="180" fill="#e86a3e" transform="rotate(135 600 170)"/>
    <rect x="560" y="80" width="80" height="180" fill="#d85a34" transform="rotate(157.5 600 170)"/>
    <rect x="560" y="80" width="80" height="180" fill="#c84a2a" transform="rotate(180 600 170)"/>
    <rect x="560" y="80" width="80" height="180" fill="#d85a34" transform="rotate(202.5 600 170)"/>
    <rect x="560" y="80" width="80" height="180" fill="#e86a3e" transform="rotate(225 600 170)"/>
    <rect x="560" y="80" width="80" height="180" fill="#f57c2a" transform="rotate(247.5 600 170)"/>
    <rect x="560" y="80" width="80" height="180" fill="#f57c2a" transform="rotate(270 600 170)"/>
    <rect x="560" y="80" width="80" height="180" fill="#f57c2a" transform="rotate(292.5 600 170)"/>
    <rect x="560" y="80" width="80" height="180" fill="#e86a3e" transform="rotate(315 600 170)"/>
    <rect x="560" y="80" width="80" height="180" fill="#d85a34" transform="rotate(337.5 600 170)"/>
  </g>

  <!-- Sun circle (partial, behind mountains) -->
  <circle cx="600" cy="280" r="140" fill="#f57c2a" opacity="0.7"/>

  <!-- Mountains -->
  <g id="mountains">
    <!-- Back mountain (lighter) -->
    <polygon points="250,450 600,200 950,450" fill="#2f567d" opacity="0.85"/>
    
    <!-- Front left mountain -->
    <polygon points="150,500 450,250 700,500" fill="#1e3d67"/>
    
    <!-- Front right mountain -->
    <polygon points="500,480 850,180 1050,480" fill="#1e3d67"/>
    
    <!-- Orange accent on right mountain -->
    <polygon points="750,320 820,280 850,380" fill="#f57c2a"/>
    
    <!-- Snow/highlight on peaks -->
    <polygon points="600,200 620,250 580,250" fill="#e8f0f8" opacity="0.6"/>
    <polygon points="850,180 880,260 820,260" fill="#e8f0f8" opacity="0.5"/>
  </g>

  <!-- Ground/desert curves -->
  <g id="ground">
    <path d="M 150 520 Q 600 420 1050 520" stroke="#a0743d" stroke-width="45" fill="none" stroke-linecap="round"/>
    <path d="M 100 580 Q 600 460 1100 580" stroke="#d08040" stroke-width="50" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Text: IEDRC -->
  <g id="text-logo" font-family="Arial, sans-serif" font-weight="900" font-size="280" letter-spacing="15">
    <!-- IE in orange -->
    <text x="100" y="900" fill="#f57c2a">IE</text>
    
    <!-- D in orange -->
    <text x="520" y="900" fill="#f57c2a">D</text>
    
    <!-- RC in navy -->
    <text x="750" y="900" fill="#1e3d67">RC</text>
  </g>

  <!-- Text: Organization name -->
  <g id="text-subtitle" font-family="Arial, sans-serif" font-weight="700" font-size="60" letter-spacing="3" fill="#1e3d67">
    <text x="100" y="1050">INLAND EMPIRE/DESERT</text>
    <text x="100" y="1130">REGIONAL CONSORTIUM</text>
  </g>
</svg>
